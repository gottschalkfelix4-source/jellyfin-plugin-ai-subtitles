name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["manifest.json", "README.md"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test -c Release
